name: Release Packaging

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-and-package:
    name: Build & Package Windows Release Candidate
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress
          $innoPath = "C:\Program Files (x86)\Inno Setup 6"
          if (Test-Path $innoPath) {
            Write-Host "Adding Inno Setup to GITHUB_PATH: $innoPath"
            "$innoPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Install Node Dependencies
        run: npm ci

      - name: Combined Quality Gate - Node Validation
        run: |
          npm run typecheck
          npm run build
          npm test

      - name: Combined Quality Gate - .NET Test Suite (Release)
        run: dotnet test dotnet/AG2Router.sln -c Release --verbosity normal

      - name: Run Release Packaging Procedure
        shell: pwsh
        run: |
          ./scripts/package-release.ps1 -Configuration Release -Version 0.1.0

      - name: Upload Release Candidate Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AG2Router-v0.1.0-win-x64
          path: |
            dist/*.zip
            dist/*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
