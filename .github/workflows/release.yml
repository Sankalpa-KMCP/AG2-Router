name: Release Packaging

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-and-package:
    name: Build & Package Windows Release Candidate
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Canonical Version
        id: version
        shell: pwsh
        run: |
          [xml]$props = Get-Content "dotnet/Directory.Build.props"
          $canonicalVersion = $props.Project.PropertyGroup.Version
          Write-Host "Canonical Version: $canonicalVersion"
          "version=$canonicalVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Verify Release Tag Matches Canonical Version
        if: github.event_name == 'push' && github.ref_type == 'tag'
        shell: pwsh
        run: |
          $expectedTag = "v${{ steps.version.outputs.version }}"
          $actualTag = "${{ github.ref_name }}"
          if ($actualTag -ne $expectedTag) {
            throw "Release tag/version mismatch. Expected '$expectedTag' but received '$actualTag'."
          }

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Combined Quality Gate - Node Validation
        run: |
          npm run typecheck
          npm run build
          npm test

      - name: Combined Quality Gate - .NET Test Suite (Release)
        run: dotnet test dotnet/AG2Router.sln -c Release --verbosity normal

      - name: Provision Pinned Inno Setup
        id: inno
        shell: pwsh
        run: |
          ./scripts/provision-inno.ps1 -PinnedVersion 6.4.0

      - name: Run Release Packaging Procedure
        shell: pwsh
        run: |
          ./scripts/package-release.ps1 `
            -Configuration Release `
            -RequireInstaller `
            -IsccPath '${{ steps.inno.outputs.iscc_path }}'

      - name: Assert Required Release Outputs
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $requiredOutputs = @(
            "dist/AG2Router-v$version-win-x64.zip",
            "dist/SHA256SUMS.txt",
            "dist/AG2Router-Setup-v$version-win-x64.exe"
          )
          foreach ($output in $requiredOutputs) {
            if (-not (Test-Path -LiteralPath $output -PathType Leaf) -or (Get-Item -LiteralPath $output).Length -eq 0) {
              throw "Required release output is missing: $output"
            }
          }

      - name: Upload Release Candidate Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AG2Router-v${{ steps.version.outputs.version }}-win-x64
          path: |
            dist/AG2Router-v${{ steps.version.outputs.version }}-win-x64.zip
            dist/AG2Router-Setup-v${{ steps.version.outputs.version }}-win-x64.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
