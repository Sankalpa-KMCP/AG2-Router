name: .NET Windows CI

on:
  push:
    branches: [ main, feat/dotnet-native-shell ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: .NET 10 Build & Test (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore dotnet/AG2Router.sln

      - name: Build solution (Release)
        run: dotnet build dotnet/AG2Router.sln -c Release --no-restore

      - name: Run unit tests
        run: dotnet test dotnet/AG2Router.sln -c Release --no-build --verbosity normal
